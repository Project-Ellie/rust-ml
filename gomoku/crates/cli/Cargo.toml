[package]
name = "cli"
description = "Terminal frontend: play Gomoku on either engine board"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cli"
path = "src/lib.rs"

[[bin]]
name = "gomoku"
path = "src/main.rs"

[[bin]]
name = "historydemo"
path = "src/bin/historydemo.rs"

[features]
default = ["naive-engine", "baseline", "net"]
naive-engine = ["engine/testutil"]
baseline = ["dep:baseline"]
net = ["dep:net", "dep:burn"]

[dependencies]
engine = { path = "../engine" }
mcts = { path = "../mcts" }
player = { path = "../player" }
thiserror.workspace = true
clap = { workspace = true, features = ["derive" ]}
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true }
crossterm.workspace = true
baseline = { path = "../baseline", optional = true }
net = { path = "../net", optional = true }
burn = { workspace = true, optional = true, features = ["flex"] }


[dev-dependencies]
serde_json = "1"
engine = { path = "../engine", features = ["testutil"]}
proptest.workspace = true
testkit = { path = "../testkit"}